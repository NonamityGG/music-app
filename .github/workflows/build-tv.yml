name: Собрать Резонанс OS (ТВ)

on:
  push:
    # tv-dev: test builds without a release
    branches: [main, tv-dev]
    paths:
      - 'tv/**'
      - 'src/waves.js'
      - 'desktop/web/looks.js'
      - '.github/workflows/build-tv.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tv
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: v
        run: |
          v=$(cat tv/VERSION)
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then v="$v-dev.${{ github.run_number }}"; fi
          echo "TV_VERSION_NAME=$v" >> "$GITHUB_ENV"
          echo "TV_VERSION_CODE=$(( ${{ github.run_number }} + 100 ))" >> "$GITHUB_ENV"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Install packages
        run: npm ci

      - name: Build the page
        run: node tv/build.mjs

      - name: Build APK
        working-directory: tv/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Name APK and installer
        run: |
          cp tv/android/app/build/outputs/apk/release/app-release.apk "Rezonans-OS-${TV_VERSION_NAME}.apk"
          cp tv/install/Install-Rezonans-OS.cmd tv/install/Restore-Sber-Home.cmd .

      - uses: actions/upload-artifact@v4
        with:
          name: rezonans-os
          path: |
            Rezonans-OS-*.apk
            Install-Rezonans-OS.cmd
            Restore-Sber-Home.cmd

  # the installer's PowerShell must at least parse on Windows
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse installer scripts
        shell: pwsh
        run: |
          foreach ($f in 'tv/install/Install-Rezonans-OS.cmd', 'tv/install/Restore-Sber-Home.cmd') {
            $s = [IO.File]::ReadAllText($f, [Text.Encoding]::UTF8)
            $code = $s.Substring($s.IndexOf('#PSSTART'))
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseInput($code, [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { $errors | ForEach-Object { Write-Host "$f : $($_.Message) (line $($_.Extent.StartLineNumber))" }; throw "parse errors in $f" }
            Write-Host "$f parses"
          }

  # the launcher on a real Android TV system (an emulator): installed as the
  # installer does it, the remote pressed, the screen photographed
  smoke:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: rezonans-os

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on Android TV
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: android-tv
          arch: x86
          profile: tv_1080p
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tv/ci/smoke.sh "$(ls Rezonans-OS-*.apk | head -1)"

      - name: Share smoke results
        if: always()
        run: |
          dir="$RUNNER_TEMP/smoke-tv-repo"
          mkdir -p "$dir"
          cp -r smoke-tv/* "$dir/" 2>/dev/null || true
          echo "run ${{ github.run_number }} ${{ github.sha }}" > "$dir/run.txt"
          cd "$dir"
          git init -q
          git config user.name ci
          git config user.email ci@users.noreply.github.com
          git checkout -q -b ci-smoke-tv
          git add -A
          git commit -q -m "tv smoke ${{ github.run_number }}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-smoke-tv

  release:
    needs: [build, smoke, installer]
    if: always() && needs.build.result == 'success' && needs.installer.result == 'success' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: rezonans-os

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tv-v${{ needs.build.outputs.version }}
          name: Резонанс OS ${{ needs.build.outputs.version }} — для телевизора
          body: |
            Резонанс OS — домашний экран для ТВ-приставок на Android (SberBox и другие): часы и погода, «Сейчас играет», избранные приложения с подсветкой, волны, которые слышат звук, заставка.

            Установка с компьютера (Windows): скачай Rezonans-OS-${{ needs.build.outputs.version }}.apk и Install-Rezonans-OS.cmd в одну папку, запусти Install-Rezonans-OS.cmd и следуй подсказкам. Нужна включённая отладка по сети на приставке.
            Вернуть экран Сбера: Restore-Sber-Home.cmd.
          files: |
            Rezonans-OS-*.apk
            Install-Rezonans-OS.cmd
            Restore-Sber-Home.cmd
          make_latest: false
