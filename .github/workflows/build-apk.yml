name: Собрать APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      APP_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      # 1.1.0 is build 8; every build after it counts up
      - name: Version
        run: echo "APP_VERSION_NAME=1.1.$(( ${{ github.run_number }} - 8 ))" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Install packages
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build web part
        run: npm run build

      - name: Copy web part into Android project
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk "Rezonans-${APP_VERSION_NAME}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Rezonans-${{ env.APP_VERSION_NAME }}
          path: Rezonans-*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION_NAME }}
          name: Резонанс ${{ env.APP_VERSION_NAME }}
          body: |
            Скачай файл Rezonans-${{ env.APP_VERSION_NAME }}.apk ниже и открой его на телефоне.
            Если уже стоит прошлая версия — новая установится поверх, данные сохранятся.
          files: Rezonans-*.apk
          make_latest: true
