<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'" />
    <title>Резонанс — Пуск</title>
    <link rel="stylesheet" href="fonts.css" />
    <link rel="stylesheet" href="start.css" />
  </head>
  <body>
    <main class="panel" id="panel">
      <canvas id="waves" aria-hidden="true"></canvas>

      <div class="search">
        <span class="s-ic" id="searchIcon" aria-hidden="true"></span>
        <input id="q" type="text" placeholder="Поиск приложений и в интернете" autocomplete="off" spellcheck="false" />
      </div>

      <div class="views" id="views">
        <!-- the first page: pinned apps -->
        <section class="view home" id="home">
          <div class="head">
            <span class="h">Закреплённые</span>
            <button class="pill" id="toAll">Все приложения<span class="chev" id="chevR"></span></button>
          </div>
          <div class="scroll">
            <div class="grid" id="pinned"></div>
            <div class="empty-pins hidden" id="noPins">Закрепите приложения: правая кнопка мыши на приложении в списке «Все приложения»</div>
          </div>
        </section>

        <!-- every app, by letter -->
        <section class="view all" id="all">
          <div class="head">
            <span class="h">Все приложения</span>
            <button class="pill" id="toHome"><span class="chev back" id="chevL"></span>Назад</button>
          </div>
          <div class="scroll" id="allScroll">
            <div class="list" id="apps"></div>
          </div>
        </section>

        <!-- search -->
        <section class="view results" id="resultsView">
          <div class="scroll">
            <div class="list" id="results"></div>
          </div>
        </section>
      </div>

      <footer class="foot">
        <button class="who" id="who" title="Учётная запись">
          <span class="ava" id="ava" aria-hidden="true"></span>
          <span class="uname" id="uname">Пользователь</span>
        </button>
        <div class="foot-r">
          <button class="icn" id="rez" title="Настройки Резонанса" aria-label="Настройки Резонанса"><span class="mark"><i></i><i></i><i></i><i></i></span></button>
          <button class="icn" id="winSet" title="Параметры Windows" aria-label="Параметры Windows"></button>
          <button class="icn" id="power" title="Питание" aria-label="Питание"></button>
        </div>
      </footer>

      <div class="menu hidden" id="pwMenu"></div>
      <div class="menu ctx hidden" id="ctx"></div>
    </main>
    <script src="start.js"></script>
  </body>
</html>
