 <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b78bd5" stop-opacity=".58"/><stop offset="1" stop-color="#50365f" stop-opacity=".08"/></linearGradient>
 <linearGradient id="petal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d9a9e9" stop-opacity=".68"/><stop offset="1" stop-color="#68427e" stop-opacity=".12"/></linearGradient>
 <g id="leafShape"><path d="M0 0 C-95 -65 -150 -170 -35 -220 C45 -170 70 -70 0 0Z" fill="url(#leaf)" stroke="#cba7dc" stroke-opacity=".38" stroke-width="3"/><path d="M0 0 Q-22 -105 -35 -218" fill="none" stroke="#d9b8e6" stroke-opacity=".32" stroke-width="2"/></g>
 <g id="flower"><g fill="url(#petal)" stroke="#d5addf" stroke-opacity=".45" stroke-width="2"><ellipse cy="-62" rx="31" ry="66"/><ellipse cy="-62" rx="31" ry="66" transform="rotate(60)"/><ellipse cy="-62" rx="31" ry="66" transform="rotate(120)"/><ellipse cy="-62" rx="31" ry="66" transform="rotate(180)"/><ellipse cy="-62" rx="31" ry="66" transform="rotate(240)"/><ellipse cy="-62" rx="31" ry="66" transform="rotate(300)"/></g><circle r="25" fill="#d7b0df" fill-opacity=".42"/><circle r="8" fill="#f0d8f4" fill-opacity=".55"/></g>
