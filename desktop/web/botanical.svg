<rect width="1920" height="1080" fill="url(#bg)"/>
<g opacity=".75">
 <g transform="translate(130 940) rotate(-24) scale(1.8)"><use href="#leafShape"/><use href="#leafShape" transform="rotate(65) translate(0 -10)"/><use href="#leafShape" transform="rotate(130) translate(0 -20)"/><use href="#flower" transform="translate(45 -160) scale(.8)"/></g>
