 <g transform="translate(1510 160) rotate(165) scale(1.15)"><use href="#leafShape"/><use href="#leafShape" transform="rotate(65) translate(0 -10)"/><use href="#flower" transform="translate(35 -145) scale(.7)"/></g>
 <g transform="translate(330 170) rotate(-130) scale(1.1)"><use href="#leafShape"/><use href="#leafShape" transform="rotate(65) translate(0 -10)"/><use href="#flower" transform="translate(35 -145) scale(.7)"/></g>
