<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'" />
    <title>Резонанс — быстрые настройки</title>
    <link rel="stylesheet" href="fonts.css" />
    <link rel="stylesheet" href="quick.css" />
  </head>
  <body>
    <main class="panel" id="panel">
      <canvas id="waves" aria-hidden="true"></canvas>

      <section class="np hidden" id="np">
        <span class="cover" id="cover" aria-hidden="true"></span>
        <div class="np-body">
          <div class="np-app" id="npApp"></div>
          <div class="np-title" id="npTitle">Ничего не играет</div>
          <div class="np-artist" id="npArtist"></div>
        </div>
        <div class="np-ctl">
          <button id="prev" aria-label="Предыдущий"></button>
          <button id="play" class="play" aria-label="Играть или пауза"></button>
          <button id="next" aria-label="Следующий"></button>
        </div>
      </section>

      <section class="main">
        <div class="tiles" id="tiles"></div>

        <div class="slider" id="volRow">
          <button class="sl-ic" id="volIc" aria-label="Выключить или включить звук"></button>
          <input id="vol" type="range" min="0" max="100" value="50" aria-label="Громкость" />
          <button class="sl-out" id="outBtn" title="Устройство вывода звука" aria-expanded="false"><span id="outIc"></span><span class="chev" id="outChev"></span></button>
        </div>

        <div class="outs hidden" id="outList">
          <div class="outs-h">Вывод звука</div>
          <div id="outItems"></div>
        </div>
      </section>

      <footer class="foot">
        <div class="bat hidden" id="batRow">
          <span class="bat-ic" id="batIc" aria-hidden="true"></span>
          <span id="batText"></span>
        </div>
        <div class="foot-r">
          <button class="icn" id="winSettings" title="Параметры Windows" aria-label="Параметры Windows"></button>
          <button class="icn" id="power" title="Питание" aria-label="Питание"></button>
        </div>
      </footer>
      <div class="menu hidden" id="pwMenu"></div>
    </main>
    <script src="quick.js"></script>
  </body>
</html>
