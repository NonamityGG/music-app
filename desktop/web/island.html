<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'" />
    <title>Резонанс — остров</title>
    <link rel="stylesheet" href="fonts.css" />
    <link rel="stylesheet" href="island.css" />
  </head>
  <body>
    <div class="isl idle" id="isl">
      <div class="aura" aria-hidden="true"></div>
      <div class="cv" id="cv">
        <svg class="ring" viewBox="0 0 40 40" aria-hidden="true"><circle class="ring-bg" cx="20" cy="20" r="18.5" /><circle class="ring-fg" id="ring" cx="20" cy="20" r="18.5" /></svg>
        <i id="cvImg"></i>
      </div>
      <span class="mark" id="mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      <div class="mini" id="mini">
        <span class="mini-title" id="miniTitle"></span>
        <span class="eq" id="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      </div>
      <div class="full" id="full">
        <div class="head">
          <div class="meta">
            <div class="app"><b id="dot"></b><span id="app">Плеер</span></div>
            <div class="title" id="title">Ничего не играет</div>
            <div class="artist" id="artist">Включи музыку в любом плеере — она появится здесь</div>
          </div>
          <span class="eq big" id="eq2" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
        </div>
        <div class="seek" id="seek">
          <span class="t" id="tPos">0:00</span>
          <div class="track" id="track"><i id="fill"></i><b id="knob"></b></div>
          <span class="t r" id="tDur">0:00</span>
        </div>
        <div class="ctl">
          <button id="prev" aria-label="Предыдущий"></button>
          <button id="play" class="big" aria-label="Играть или пауза"></button>
          <button id="next" aria-label="Следующий"></button>
        </div>
      </div>
    </div>
    <script src="island.js"></script>
  </body>
</html>
