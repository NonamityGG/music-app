<!doctype html>
<html lang="ru" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0f0b16" />
    <title>Резонанс</title>
    <script>
      // the saved theme, before anything is drawn (no flash of the wrong colours)
      try {
        var s = JSON.parse(localStorage.getItem('rez.settings') || '{}');
        var t = s.theme || 'dark';
        var r = document.documentElement;
        r.setAttribute('data-theme', t);
        if (t.indexOf('glass') === 0) r.setAttribute('data-glass', '');
        if (t === 'light' || t === 'glass-light') r.setAttribute('data-light', '');
      } catch (e) {}
    </script>
    <link rel="preload" href="fonts/unbounded-cyrillic-700-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="style.css" />
    <style>
      /*INTRO_CSS*/
    </style>
  </head>
  <body>
    <div id="app"></div>
    <!-- the launch intro; it loads app.js once its first frames are on screen -->
    <script>
      /*INTRO_JS*/
    </script>
    <script>
      // safety net: if the intro could not run at all, start the app anyway
      setTimeout(function () {
        if (!document.getElementById('rez-app')) {
          var s = document.createElement('script');
          s.id = 'rez-app';
          s.src = 'app.js';
          document.body.appendChild(s);
        }
        var i = document.getElementById('intro');
        if (i && !(window.rezIntro && window.rezIntro.active)) i.parentNode.removeChild(i);
      }, 1500);
    </script>
  </body>
</html>
