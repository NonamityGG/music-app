<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Резонанс</title>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="waves" aria-hidden="true"></canvas>
<div id="shade" aria-hidden="true"></div>

<main id="home">
  <div id="hpages"></div>
  <div id="hdots"></div>
  <button id="find" class="glass"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg><span>Поиск</span></button>
  <nav id="dock" class="glass apps"></nav>
</main>

<section id="drawer" aria-hidden="true">
  <div id="d-body">
    <div id="pages"></div>
    <div id="dots"></div>
    <div id="d-results">
      <div id="d-found" class="apps"></div>
      <div id="d-web"></div>
    </div>
  </div>
  <div id="d-bottom">
    <label id="q-wrap" class="glass">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>
      <input id="q" type="search" placeholder="Поиск приложений" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="go">
      <button id="q-x" class="bare" aria-label="Очистить" hidden><svg viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17"/></svg></button>
      <button id="d-more" class="bare" aria-label="Настройки"><svg viewBox="0 0 24 24"><circle cx="12" cy="5.5" r="1.3" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.3" fill="currentColor" stroke="none"/><circle cx="12" cy="18.5" r="1.3" fill="currentColor" stroke="none"/></svg></button>
    </label>
  </div>
</section>

<div id="scrim"></div>
<div id="menu" class="pop"></div>
<div id="trash" class="glass"><svg viewBox="0 0 24 24"><path d="M5 7h14M10 7V5h4v2M7 7l1 12h8l1-12"/></svg><span>Убрать</span></div>

<section id="sheet">
  <i class="grab"></i>
  <h2>Резонанс</h2>
  <div id="sheet-body"></div>
</section>

<div id="toast"></div>
<script src="app.js"></script>
</body>
</html>
