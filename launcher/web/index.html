<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="color-scheme" content="dark">
<title>Резонанс</title>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="waves" aria-hidden="true"></canvas>
<div id="shade" aria-hidden="true"></div>

<main id="home">
  <header id="top">
    <button id="clock" class="bare" aria-label="Часы"><span id="time">00:00</span></button>
    <button id="date" class="bare"><span id="day"></span><span id="batt"></span></button>
  </header>

  <section id="np" class="glass" hidden>
    <img id="np-art" alt="">
    <div id="np-text">
      <b id="np-title"></b>
      <span id="np-artist"></span>
    </div>
    <div id="np-ctl">
      <button class="np-b" data-a="prev" aria-label="Назад"><svg viewBox="0 0 24 24"><path d="M7 6v12M18 6.5v11a.6.6 0 0 1-.9.5L9.2 12.5a.6.6 0 0 1 0-1l7.9-5.5a.6.6 0 0 1 .9.5z"/></svg></button>
      <button class="np-b np-play" data-a="toggle" aria-label="Пауза"><svg viewBox="0 0 24 24"><path class="i-pause" d="M8.5 6v12M15.5 6v12"/><path class="i-play" d="M8 5.8v12.4a.7.7 0 0 0 1.05.6l10-6.2a.7.7 0 0 0 0-1.2l-10-6.2A.7.7 0 0 0 8 5.8z"/></svg></button>
      <button class="np-b" data-a="next" aria-label="Дальше"><svg viewBox="0 0 24 24"><path d="M17 6v12M6 6.5v11a.6.6 0 0 0 .9.5l7.9-5.5a.6.6 0 0 0 0-1L6.9 6a.6.6 0 0 0-.9.5z"/></svg></button>
    </div>
    <i id="np-bar"><i></i></i>
  </section>

  <div id="fill"></div>
  <div id="grid" class="apps"></div>
  <button id="find" class="glass"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg><span>Поиск</span></button>
  <nav id="dock" class="glass apps"></nav>
</main>

<section id="drawer" aria-hidden="true">
  <div id="d-body">
    <div id="pages"></div>
    <div id="dots"></div>
    <div id="d-results">
      <div id="d-found" class="apps"></div>
      <div id="d-web"></div>
    </div>
  </div>
  <div id="d-bottom">
    <label id="q-wrap" class="glass">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>
      <input id="q" type="search" placeholder="Поиск приложений" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="go">
      <button id="q-x" class="bare" aria-label="Очистить" hidden><svg viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17"/></svg></button>
      <button id="d-more" class="bare" aria-label="Настройки"><svg viewBox="0 0 24 24"><circle cx="12" cy="5.5" r="1.3" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.3" fill="currentColor" stroke="none"/><circle cx="12" cy="18.5" r="1.3" fill="currentColor" stroke="none"/></svg></button>
    </label>
  </div>
</section>

<div id="scrim"></div>
<div id="menu" class="pop"></div>
<div id="trash" class="glass"><svg viewBox="0 0 24 24"><path d="M5 7h14M10 7V5h4v2M7 7l1 12h8l1-12"/></svg><span>Убрать</span></div>

<section id="sheet">
  <i class="grab"></i>
  <h2>Резонанс</h2>
  <div id="sheet-body"></div>
</section>

<div id="toast"></div>
<script src="app.js"></script>
</body>
</html>
